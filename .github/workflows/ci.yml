name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/goldr/go.sum
            examples/*/go.sum
            tools/check/go.sum

      - name: Check
        run: scripts/check-all.sh

  minimum-go:
    name: Go 1.26.0 compatibility
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up minimum Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            go.sum
            cmd/goldr/go.sum
            examples/*/go.sum

      - name: Check minimum Go compatibility
        run: scripts/check-minimum-go.sh
