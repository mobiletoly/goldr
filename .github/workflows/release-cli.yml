name: Release CLI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CLI companion
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish CLI tag and release
        uses: actions/github-script@v9
        with:
          script: |
            const publishCLI = require('./.github/scripts/release-cli.cjs');
            await publishCLI({ github, context, core });
